<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>breakout</title>
</head>
<body>
    <canvas id="canvas"></canvas>
   <style>
    body{
        text-align: center;
    }
       #canvas{
        background-color: black;
        border-top:5px solid skyblue;
        border-left:5px solid skyblue;
        border-right:5px solid skyblue;
        border-bottom:5px solid skyblue;                   
    }
   </style>
   <script>
      let canvas;
      let board_width=500;
      let board_height=500;
      let context;
      let player_height=10;
      let player_width=80;
      let player_velocityx=10;
      let player={
        x:board_width/2-player_width/2,
        y:board_height-player_height-5,
        width:player_width,
        height:player_height,
        VelocityX:player_velocityx
      }
      let ball_width=10;
      let ball_height=10;
      let ball_velocityx=3;
      let ball_velocityy=2;
      let ball={
        x:board_width/2,
        y:board_height/2,
        width:ball_width,
        height:ball_height,
        VelocityX:ball_velocityx,
        VelocityY:ball_velocityy
      }
      window.onload=function(){
      canvas=document.getElementById("canvas");
      canvas.height=board_height;
      canvas.width=board_width;
      context=canvas.getContext("2d");
      context.fillStyle="lightyellow";
      context.fillRect(player.x,player.y,player.width,player.height);
      requestAnimationFrame(update);
      document.addEventListener("keydown",movePlayer);
      }
      function update(){
        requestAnimationFrame(update);
        context.clearRect(0,0,canvas.width,canvas.height);
        context.fillStyle="lightyellow";
        context.fillRect(player.x,player.y,player.width,player.height);
        context.fillStyle="white";
        ball.x+=ball.VelocityX;
        ball.y+=ball.VelocityY;
        context.fillRect(ball.x,ball.y,ball.width,ball.height);
        if(ball.y<=0){
            ball.VelocityY*=-1;
        }
        if(ball.x<=0||(ball.x+ball.width)>=board_width){
            ball.VelocityX*=-1;
        }
        // else if(ball.y+ball.height>=boardHeight){
        //     gameOver();
        // }
      }
      function outOfBounds(xPosition){
        return(xPosition<0||xPosition+player_width>board_width)
      }
      function movePlayer(e){
        if(e.code=="ArrowLeft"){
            let nextPlayerX=player.x-player.VelocityX;
            if(!outOfBounds(nextPlayerX)){
                player.x=nextPlayerX;
            }
        }
        else if(e.code=="ArrowRight"){
            let nextPlayerX=player.x+player.VelocityX;
            if(!outOfBounds(nextPlayerX)){
                player.x=nextPlayerX;
            }
        }
        if(topCollision(ball,player)||bottomCollision(ball,player)){
            ball.VelocityY*=-1;
        }
        else if(leftCollision(ball,player)||rightCollision(ball,player)){
            ball.VelocityX*=-1;
        }
      }
      function detectCollision(a,b){
        return a.x<b.x+b.width &&
             a.x+a.width>b.x &&
             a.y+b.y+b.height &&
             a.y+a.height>b.y;
      }
      function topCollision(ball,block){
        return detectCollision(ball,block)&&(ball.y+ball.height)>=block.y;
      }
      function bottomCollision(ball,block){
        return detectCollision(ball,block)&&(block.y+block.height)>=ball.y;
      }
      function leftCollision(ball,block){
        return detectCollision(ball,block)&&(ball.x+ball.width>=block.x);
      }
      function rightCollision(ball,block){
        return detectCollision(ball,block)&&(block.x+block.width>=ball.x);
      }
   </script>
</body>
</html>
