<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>breakout</title>
</head>
<body>
    <canvas id="canvas"></canvas>
   <style>
    body{
        margin:0;
        padding-top:40px;
        min-height:100vh;
        box-sizing:border-box;
        text-align:center;
        background:lightslategray;
    }
    #canvas{
        display:block;
        margin:0 auto;
        background-color:black;
        border:5px solid skyblue;
    }
   </style>
   <script>
    let audio_ctx=null;
    document.addEventListener("keydown",()=>{
        if(!audio_ctx){
            audio_ctx=new AudioContext();
        }
        audio_ctx.resume();
    })
    const hz=(n)=>440*Math.pow(2,(n-69)/12);
    const A3=57,A4=69,C5=72,E5=76,A5=81;
    const music=(midi,delay,duration,type,volume,cutoff)=>{
        if(!audio_ctx)return;
    const time=audio_ctx.currentTime+delay;
    const oscillator=audio_ctx.createOscillator();
    const gain=audio_ctx.createGain();
    const frequency=audio_ctx.createBiquadFilter();
    oscillator.type=type;
    oscillator.frequency.setValueAtTime(hz(midi),time);
    frequency.type="lowpass";
    frequency.frequency.value=cutoff;
    gain.gain.setValueAtTime(volume,time);
    gain.gain.exponentialRampToValueAtTime(0.001,time+duration);
    oscillator.connect(frequency);
    frequency.connect(gain);
    gain.connect(audio_ctx.destination);
    oscillator.start(time);
    oscillator.stop(time+duration);
   }
     const start_sound=()=>{
        music(A4,0,0.1,"triangle",0.2,6000);
        music(C5,0.1,0.1,"triangle",0.2,6000);
        music(E5,0.2,0.25,"triangle",0.2,6000);
     }
     const break_sound=()=>{
        music(E5,0,0.06,"square",0.06,3000);
     }
     const paddle_sound=()=>{
        music(A4,0,0.08,"triangle",0.12,6000);
     }
     const levelup_sound=()=>{
        music(A4,0,0.1,"triangle",0.2,6000);
        music(C5,0.1,0.1,"triangle",0.2,6000);
        music(E5,0.2,0.1,"triangle",0.2,6000);
        music(A5,0.3,0.35,"triangle",0.2,6000);
     }
     const gameover_sound=()=>{
        music(E5,0,0.2,"square",0.15,800);
        music(C5,0.2,0.2,"square",0.15,800);
        music(A4,0.4,0.2,"square",0.15,800);
        music(A3,0.6,0.5,"square",0.15,400);
     }
      let canvas;
      let boardWidth=500;
      let boardHeight=500;
      let context;
      let playerHeight=10;
      let playerWidth=80;
      let playerVelocityX=300;
      let player={
        x:boardWidth/2-playerWidth/2,
        y:boardHeight-playerHeight-5,
        width:playerWidth,
        height:playerHeight,
        VelocityX:playerVelocityX
      }
      let ballWidth=10;
      let ballHeight=10;
      let ballVelocityX=180;
      let ballVelocityY=120;
      let ball={
        x:boardWidth/2,
        y:boardHeight/2,
        width:ballWidth,
        height:ballHeight,
        VelocityX:ballVelocityX,
        VelocityY:ballVelocityY
      }
      let blockArray=[];
      let blockWidth=50;
      let blockHeight=10;
      let blockColumns=8;
      let blockRows=3;
      let blockMaxRows=10;
      let blockCount=0;
      let blockX=15;
      let blockY=45;
      let score=0;
      let gameOver=false;
      let bestScore=0;
      let leftPressed=false;
      let rightPressed=false;
      let lastTime=0;
      let speedMultiplier=1;
      let speedIncrease=1.1;
      let maxSpeedMultiplier=2;
      let start=false;
      window.onload=function(){
      canvas=document.getElementById("canvas");
      canvas.height=boardHeight;
      canvas.width=boardWidth;
      context=canvas.getContext("2d");
      requestAnimationFrame(update);
      document.addEventListener("keydown",movePlayer);
      document.addEventListener("keyup",keyUp);
      createBlocks();
      }
      function update(timestamp){
        requestAnimationFrame(update);
        let dt=Math.min((timestamp-lastTime)/1000,0.05);
        lastTime=timestamp;
        if(gameOver)return;
        if(leftPressed){
            let nextPlayerX=player.x-player.VelocityX*dt;
            if(!outOfBounds(nextPlayerX)){
                player.x=nextPlayerX;
            }
        }
        if(rightPressed){
            let nextPlayerX=player.x+player.VelocityX*dt;
            if(!outOfBounds(nextPlayerX)){
                player.x=nextPlayerX;
            }
        }
        context.clearRect(0,0,canvas.width,canvas.height);
        context.fillStyle="yellow";
        context.fillRect(player.x,player.y,player.width,player.height);
        context.fillStyle="white";
        ball.prevX=ball.x;
        ball.prevY=ball.y;
        if(start){
        ball.x+=ball.VelocityX*dt;
        ball.y+=ball.VelocityY*dt;
        }
        context.fillRect(ball.x,ball.y,ball.width,ball.height);
        context.fillStyle="skyblue";
        for(let i=0;i<blockArray.length;i++){
            let block=blockArray[i];
            if(!block.break){
                if(topCollision(ball,block)||bottomCollision(ball,block)){
                    block.break=true;
                    ball.VelocityY*=-1;
                    blockCount-=1;
                    score+=100;
                    break_sound();
                }
                else if(leftCollision(ball,block)||rightCollision(ball,block)){
                    block.break=true;
                    ball.VelocityX*=-1;
                    blockCount-=1;
                    score+=100;
                    break_sound();
                }
                else{
                context.fillRect(block.x,block.y,block.width,block.height);
                }
            }
        }
        if(blockCount==0){
            score+=100*blockRows*blockColumns;
            blockRows=Math.min(blockRows+1,blockMaxRows);
            speedMultiplier=Math.min(speedMultiplier*speedIncrease,maxSpeedMultiplier);
            createBlocks();
            resetBall();
            levelup_sound();
        }
        if(ball.y<=0){
            ball.y=0;
            ball.VelocityY=Math.abs(ball.VelocityY);
        }
        if(ball.x<=0){
            ball.x=0;
            ball.VelocityX=Math.abs(ball.VelocityX);
        }
        if(ball.x+ball.width>=boardWidth){
            ball.x=boardWidth-ball.width;
            ball.VelocityX=-Math.abs(ball.VelocityX);
        }
        let prevBottom=ball.y+ball.height-ball.VelocityY*dt;
        if(ball.VelocityY>0&&detectCollision(ball,player)&&prevBottom<=player.y){
            ball.VelocityY*=-1;
            ball.y=player.y-ball.height;
            paddle_sound();
        }
        else if(ball.y+ball.height>=boardHeight){
            bestScore=Math.max(bestScore,score);
            context.font="20px sans-serif";
            context.fillText("Game over: Press 'Space' to Restart",80,400)
            gameOver=true;
            gameover_sound();
            return;
        }
        context.font="20px sans-serif";
        context.fillText("score="+score,10,25);
        context.fillText("best score="+bestScore,355,25);
        if(!start){
            context.fillText("Press 'Space' to Start the Game",115,400);
        }
    }
      function outOfBounds(xPosition){
        return(xPosition<0||xPosition+playerWidth>boardWidth)
      }
      function movePlayer(e){
        if(e.code=="Space"||e.code=="ArrowLeft"||e.code=="ArrowRight")e.preventDefault();
        if(gameOver){
            if(e.code=="Space"){
                resetGame();
            }
            return;
        }
        if(e.code=="Space"&&!start){
            start=true;
            start_sound();
        }
        if(e.code=="ArrowLeft")leftPressed=true;
        if(e.code=="ArrowRight")rightPressed=true;
      }
      function keyUp(e){
        if(e.code=="ArrowLeft")leftPressed=false;
        if(e.code=="ArrowRight")rightPressed=false;
      }
      function detectCollision(a,b){
        return a.x<b.x+b.width &&
             a.x+a.width>b.x &&
             a.y<b.y+b.height &&
             a.y+a.height>b.y;
      }
      function topCollision(ball,block){
        return detectCollision(ball,block)&&(ball.prevY+ball.height)<=block.y;
      }
      function bottomCollision(ball,block){
        return detectCollision(ball,block)&&ball.prevY>=block.y+block.height;
      }
      function leftCollision(ball,block){
        return detectCollision(ball,block)&&(ball.prevX+ball.width<=block.x);
      }
      function rightCollision(ball,block){
        return detectCollision(ball,block)&&ball.prevX>=block.x+block.width;
      }
      function createBlocks(){
        blockArray=[];
        for(let c=0;c<blockColumns;c++){
            for(let r=0;r<blockRows;r++){
                let block={
                    x:blockX+c*blockWidth+c*10,
                    y:blockY+r*blockHeight+r*10,
                    width:blockWidth,
                    height:blockHeight,
                    break:false
                }
                blockArray.push(block);
            }
        }
        blockCount=blockArray.length;
      }
    function resetGame(){
        gameOver=false;
        player={
            x:boardWidth/2-playerWidth/2,
            y:boardHeight-playerHeight-5,
            width:playerWidth,
            height:playerHeight,
            VelocityX:playerVelocityX
        }
        score=0;
        blockRows=3;
        speedMultiplier=1;
        createBlocks();
        resetBall();
        start_sound();
    }
    function resetBall(){
        ball={
            x:boardWidth/2,
            y:boardHeight/2,
            width:ballWidth,
            height:ballHeight,
            VelocityX:ballVelocityX*speedMultiplier,
            VelocityY:ballVelocityY*speedMultiplier
        }
    }
   </script>
</body>
</html>
